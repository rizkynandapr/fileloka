name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
        working-directory: tests
      - run: npm test
        working-directory: tests
      - name: Generated pages are in sync with scripts/
        run: python3 scripts/generate_tool_pages.py && git diff --exit-code
